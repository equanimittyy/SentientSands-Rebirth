<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSR Web Panel</title>
  <link rel="stylesheet" href="/web/app.css">
  <script type="module" src="/web/app.js"></script>
</head>
<body>
  <header>
    <h1>Sentient Sands Rebirth</h1>
    <p id="status">Connecting...</p>
    <p id="offline" role="alert" hidden>The server is not running. Start Kenshi, or press Restart Server in the SSR HUB.</p>
    <nav>
      <a href="#settings">Settings</a>
      <a href="#llm">Models</a>
      <a href="#profile">Player profile</a>
    </nav>
  </header>
  <main>
    <section id="settings" hidden>
      <form id="settings-form">
        <fieldset>
          <legend>Interface</legend>
          <label>Language <select name="language"></select> <span class="hint">The language of the in-game windows and of the NPC replies.</span></label>
          <label>Chat key <select name="chat_hotkey"></select> <span class="hint">The key that opens the chat window.</span></label>
          <label class="check"><input type="checkbox" name="enable_welcome"> Show the welcome popup on start</label>
          <label class="check"><input type="checkbox" name="open_web_panel_on_start"> Open this web panel on start</label>
        </fieldset>
        <fieldset>
          <legend>Conversations</legend>
          <label>Talk range <input type="number" name="radii.talk" min="1" required> <span class="hint">NPCs within this distance hear what you say in talk mode.</span></label>
          <label>Yell range <input type="number" name="radii.yell" min="1" required> <span class="hint">NPCs within this distance hear what you say in yell mode.</span></label>
          <label>Radiant range <input type="number" name="radii.radiant" min="1" required> <span class="hint">A radiant conversation starts only between NPCs within this distance of you.</span></label>
          <label class="check"><input type="checkbox" name="enable_ambient"> Radiant conversations</label>
          <label>Radiant timer (s) <input type="number" name="ambient_timer" min="1" required> <span class="hint">The time between two radiant conversations. Paused time does not count.</span></label>
          <label>Dialogue delay (s) <input type="number" name="dialogue_speed" min="1" required> <span class="hint">The time between two lines of a conversation.</span></label>
          <label>Bubble life (s) <input type="number" name="bubble_life" min="1" step="0.5" required> <span class="hint">How long a speech bubble stays. It grows with the game speed.</span></label>
        </fieldset>
        <fieldset>
          <legend>World events</legend>
          <label>Events in prompt <input type="number" name="global_events_count" min="0" required> <span class="hint">How many recent world events and rumors each chat prompt holds.</span></label>
          <label>Event timer (min) <input type="number" name="synthesis_timer" min="1" required> <span class="hint">The time between two new world events.</span></label>
        </fieldset>
        <fieldset>
          <legend>Diagnostics</legend>
          <label>Log level <select name="log_level"></select> <span class="hint">The lowest level that the plugin and the server write to their logs.</span></label>
        </fieldset>
        <div class="actions save-bar">
          <button type="submit" class="save" disabled>Save</button>
          <button type="button" class="discard" disabled>Discard</button>
          <button type="button" id="settings-reset">Reset to defaults</button>
          <span class="message" id="settings-message" role="status"></span>
        </div>
      </form>
    </section>
    <section id="llm" hidden>
      <div id="llm-editor"></div>
      <div class="actions save-bar">
        <button type="button" id="llm-save" class="save" disabled>Save</button>
        <button type="button" class="discard" disabled>Discard</button>
        <span class="message" id="llm-message" role="status"></span>
      </div>
    </section>
    <section id="profile" hidden>
      <form id="profile-form" class="stacked">
        <label>Player backstory <textarea name="character_bio"></textarea> <span class="hint length"></span></label>
        <label>Faction description <textarea name="player_faction"></textarea> <span class="hint length"></span></label>
        <div class="actions save-bar">
          <button type="submit" class="save" disabled>Save</button>
          <button type="button" class="discard" disabled>Discard</button>
          <span class="message" id="profile-message" role="status"></span>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
